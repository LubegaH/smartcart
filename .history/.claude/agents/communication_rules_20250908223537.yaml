direct_channels:
  - pair: [frontend-engineer, backend-engineer]
    scope: 'api_contracts'
    protocols: ['rest', 'graphql', 'websocket']
    description: 'Direct communication for API design and contracts'
    escalation_to: tech_lead

  - pair: [qa-engineer, frontend-engineer]
    scope: 'testing_implementation'
    protocols: ['playwright', 'accessibility', 'performance']
    description: 'Direct communication for test implementation coordination'
    escalation_to: tech_lead

routed_through_main:
  - all_code_reviews
  - checkpoint_approvals
  - human_interactions
  - error_escalations
  - cross_functional_coordination
  - architecture_decisions
  - release_decisions

decision_authority:
  final_release: tech_lead
  code_quality: code_reviewer
  performance_budgets: qa-engineer
  security_policies: backend-engineer
  architecture: tech-lead
  documentation: docs-agent

conflict_resolution:
  code_reviewer_vs_qa: escalate_to_tech_lead
  performance_vs_features: qa_e2e_engineer_has_veto_power
  security_vs_usability: backend_engineer_has_veto_power
  architecture_decisions: tech_lead_final_authority

checkpoint_requirements:
  before_proceeding:
    - all_tests_passing
    - security_reviewed (backend_engineer approval)
    - performance_validated (qa_engineer approval)
    - code_quality_approved (code_reviewer approval)
    - documentation_updated (docs_agent approval)
    - tech_lead_approval
    - human_approval_for_major_features
